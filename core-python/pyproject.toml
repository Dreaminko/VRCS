[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vrcs-core"
version = "0.1.0"
description = "Local core service for VRCS"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "websockets>=13,<17",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
audio = ["PyAudioWPatch>=0.2.12.7"]
asr = ["faster-whisper>=1.1,<2"]
vad = ["faster-whisper>=1.1,<2"]
full = [
  "PyAudioWPatch>=0.2.12.7",
  "faster-whisper>=1.1,<2",
]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<1"]
release = ["pyinstaller>=6.19,<7"]

[project.scripts]
vrcs-core = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
