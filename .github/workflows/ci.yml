name: CI

on:
  workflow_call:
    inputs:
      full-check:
        description: Run all checks when this workflow is reused
        type: boolean
        default: true
      target-sha:
        description: Exact commit to validate when it differs from the caller commit
        type: string
        required: false
        default: ""
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.target-sha || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install release contract tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - name: Test CI scripts
        run: node --test scripts/test-ci-changes.mjs scripts/test-release-ci.mjs scripts/test-release-metadata.mjs
      - name: Verify manifest versions
        run: |
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("apps/desktop/src-tauri/tauri.conf.json", "utf8")).version')"
          node scripts/release-metadata.mjs check-version "$version"
      - name: Detect changed areas
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          FULL_CHECK: ${{ inputs.full-check || false }}
        run: node scripts/ci-changes.mjs

  frontend:
    needs: changes
    if: ${{ (github.event_name == 'push' && needs.changes.outputs.rust == 'true') || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate localization
        run: npm run check:i18n

      - name: Test desktop
        run: npm --workspace apps/desktop test

      - name: Test VR preview script
        run: node --test scripts/dev-vr.test.mjs

      - name: Build frontend
        run: npm run build:frontend

  rustfmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Test release metadata
        shell: pwsh
        run: ./scripts/test-release-metadata.ps1

      - name: Check Rust formatting
        shell: pwsh
        run: ./scripts/check-rust.ps1 -Check format

  rust:
    needs: [changes, rustfmt]
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-windows-x64
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          workspaces: . -> .build

      - uses: actions/cache@v6
        with:
          path: apps/desktop/src-tauri/resources/vulkan-runtime
          key: vulkan-runtime-${{ hashFiles('scripts/prepare-vulkan-runtime.ps1') }}

      - name: Test Rust check script
        shell: pwsh
        run: ./scripts/test-check-rust.ps1

      - name: Lint Rust
        shell: pwsh
        run: |
          ./scripts/check-rust.ps1 -Check clippy
          ./scripts/check-rust.ps1 -Check clippy -Vulkan -CiVulkanOnly

      - name: Test Rust
        shell: pwsh
        run: |
          ./scripts/check-rust.ps1 -Check test
          ./scripts/check-rust.ps1 -Check test -Vulkan -CiVulkanOnly

  linux:
    name: linux (${{ matrix.arch }})
    needs: [changes, rustfmt]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build
      VRCS_PACKAGE_CHANNEL: development
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha }}
          persist-credentials: false
      - name: Install native desktop dependencies
        run: bash scripts/install-linux-deps.sh
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-linux-${{ matrix.arch }}-cpu-vulkan
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          workspaces: . -> .build
      - run: npm ci
      - run: npm run build:frontend
      - name: Check native CPU and Vulkan backends and test CPU
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p vrcs-desktop --no-deps --all-targets --locked --features vr-preview -- -D warnings
          dbus-run-session -- xvfb-run -a cargo test --workspace --locked
          cargo check -p vrcs-core -p vrcs-desktop --all-targets --locked --features vulkan
      - name: Build and load native ONNX runtime
        run: node scripts/build-linux-release.mjs --preview
      - uses: actions/upload-artifact@v7
        with:
          name: ci-linux-${{ matrix.arch }}-runtime-${{ github.sha }}
          path: |
            preview-artifacts/*.runtime.json
            preview-artifacts/*.ldd.txt
          if-no-files-found: error

  gate:
    needs: [changes, frontend, rustfmt, rust, linux]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a required check did not succeed
        if: >-
          ${{ needs.changes.result != 'success' ||
              contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
              (needs.changes.outputs.rust == 'true' &&
                (needs.rustfmt.result != 'success' || needs.rust.result != 'success' || needs.linux.result != 'success')) ||
              (((github.event_name == 'push' && needs.changes.outputs.rust == 'true') || needs.changes.outputs.frontend == 'true') &&
                needs.frontend.result != 'success') }}
        run: exit 1
