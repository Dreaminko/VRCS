name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate localization
        run: npm run check:i18n

      - name: Test desktop
        run: npm --workspace apps/desktop test

      - name: Build frontend
        run: npm run build:frontend

  rust:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build
    strategy:
      matrix:
        backend: [cpu, vulkan]
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show

      - name: Prepare Vulkan SDK
        if: matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          & ./scripts/prepare-vulkan-sdk.ps1
          "VULKAN_SDK=$env:VULKAN_SDK" >> $env:GITHUB_ENV
          "CMAKE_GENERATOR=$env:CMAKE_GENERATOR" >> $env:GITHUB_ENV
          "$env:VULKAN_SDK\Bin" >> $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core -> ../.build
            apps/desktop/src-tauri -> ../../../.build

      - name: Check Rust
        shell: pwsh
        run: ./scripts/check-rust.ps1 -Vulkan:('${{ matrix.backend }}' -eq 'vulkan')
