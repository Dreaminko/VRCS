name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate localization
        run: npm run check:i18n

      - name: Test desktop
        run: npm --workspace apps/desktop test

      - name: Build frontend
        run: npm run build:frontend

  rustfmt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show

      - name: Test Rust check script
        shell: pwsh
        run: ./scripts/test-check-rust.ps1

      - name: Test release metadata
        shell: pwsh
        run: ./scripts/test-release-metadata.ps1

      - name: Check Rust formatting
        shell: pwsh
        run: ./scripts/check-rust.ps1 -Check format

  rust:
    needs: rustfmt
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, vulkan]
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core -> ../.build
            apps/desktop/src-tauri -> ../../../.build

      - name: Lint Rust
        shell: pwsh
        run: ./scripts/check-rust.ps1 -Check clippy -Vulkan:('${{ matrix.backend }}' -eq 'vulkan')

      - name: Test Rust
        shell: pwsh
        run: ./scripts/check-rust.ps1 -Check test -Vulkan:('${{ matrix.backend }}' -eq 'vulkan')
