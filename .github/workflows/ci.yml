name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: droidshiny/diff-paths@v4
        id: filter
        with:
          filters: |
            rust:
              - "core/**"
              - "apps/desktop/src-tauri/**"
              - "rust-toolchain.toml"
              - "scripts/check-rust.ps1"
              - "scripts/test-check-rust.ps1"
              - "scripts/test-release-metadata.ps1"
              - "scripts/write-release-metadata.ps1"
              - "scripts/prepare-vulkan-runtime.ps1"
              - ".github/workflows/ci.yml"
            frontend:
              - "apps/desktop/**"
              - "package.json"
              - "package-lock.json"
              - "scripts/check-i18n.mjs"
              - ".github/workflows/ci.yml"

  frontend:
    needs: changes
    if: ${{ github.event_name == 'workflow_call' || github.event_name == 'push' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate localization
        run: npm run check:i18n

      - name: Test desktop
        run: npm --workspace apps/desktop test

      - name: Build frontend
        run: npm run build:frontend

  rustfmt:
    needs: changes
    if: github.event_name == 'workflow_call' || needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show

      - name: Test Rust check script
        shell: pwsh
        run: ./scripts/test-check-rust.ps1

      - name: Test release metadata
        shell: pwsh
        run: ./scripts/test-release-metadata.ps1

      - name: Check Rust formatting
        shell: pwsh
        run: ./scripts/check-rust.ps1 -Check format

  rust:
    needs: [changes, rustfmt]
    if: github.event_name == 'workflow_call' || needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, vulkan]
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core -> ../.build
            apps/desktop/src-tauri -> ../../../.build

      - name: Lint Rust
        shell: pwsh
        run: ./scripts/check-rust.ps1 -Check clippy -Vulkan:('${{ matrix.backend }}' -eq 'vulkan')

      - name: Test Rust
        shell: pwsh
        run: ./scripts/check-rust.ps1 -Check test -Vulkan:('${{ matrix.backend }}' -eq 'vulkan')

  gate:
    needs: [changes, frontend, rustfmt, rust]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a required check did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
