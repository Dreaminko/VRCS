name: CI

on:
  workflow_call:
    inputs:
      full-check:
        description: Run all checks when this workflow is reused
        type: boolean
        default: true
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Test changed-area detection
        run: node --test scripts/test-ci-changes.mjs
      - name: Detect changed areas
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          FULL_CHECK: ${{ inputs.full-check || false }}
        run: |
          base="${BASE_SHA}"
          rust=false
          frontend=false

          # Reused workflows and new histories must preserve a full check.
          if [[ "$FULL_CHECK" == 'true' || -z "$base" || "$base" =~ ^0+$ ]]; then
            rust=true
            frontend=true
          else
            changed_files="$(git diff --name-only "$base"...HEAD)"
            while IFS= read -r file; do
              case "$file" in
                core/*|crates/*|apps/desktop/src-tauri/*|rust-toolchain.toml|scripts/check-rust.ps1|scripts/test-check-rust.ps1|scripts/test-ci-changes.mjs|scripts/test-release-metadata.ps1|scripts/write-release-metadata.ps1|scripts/prepare-vulkan-runtime.ps1|.github/workflows/ci.yml)
                  rust=true
                  ;;
              esac
              case "$file" in
                apps/desktop/*|package.json|package-lock.json|scripts/check-i18n.mjs|scripts/test-ci-changes.mjs|.github/workflows/ci.yml)
                  frontend=true
                  ;;
              esac
            done <<< "$changed_files"
          fi

          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate localization
        run: npm run check:i18n

      - name: Test desktop
        run: npm --workspace apps/desktop test

      - name: Build frontend
        run: npm run build:frontend

  rustfmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show

      - name: Test Rust check script
        shell: pwsh
        run: ./scripts/test-check-rust.ps1

      - name: Test release metadata
        shell: pwsh
        run: ./scripts/test-release-metadata.ps1

      - name: Check Rust formatting
        shell: pwsh
        run: ./scripts/check-rust.ps1 -Check format

  rust:
    needs: [changes, rustfmt]
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, vulkan]
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-windows-x64-${{ matrix.backend }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          workspaces: |
            core -> ../.build
            apps/desktop/src-tauri -> ../../../.build

      - name: Lint Rust
        shell: pwsh
        run: ./scripts/check-rust.ps1 -Check clippy -Vulkan:('${{ matrix.backend }}' -eq 'vulkan') -CiVulkanOnly:('${{ matrix.backend }}' -eq 'vulkan')

      - name: Test Rust
        shell: pwsh
        run: ./scripts/check-rust.ps1 -Check test -Vulkan:('${{ matrix.backend }}' -eq 'vulkan') -CiVulkanOnly:('${{ matrix.backend }}' -eq 'vulkan')

  gate:
    needs: [changes, frontend, rustfmt, rust]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a required check did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
