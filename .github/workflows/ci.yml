name: CI

on:
  workflow_call:
    inputs:
      full-check:
        description: Run all checks when this workflow is reused
        type: boolean
        default: true
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install release contract tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - name: Test CI scripts
        run: node --test scripts/test-ci-changes.mjs scripts/test-release-ci.mjs scripts/test-release-metadata.mjs
      - name: Detect changed areas
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          FULL_CHECK: ${{ inputs.full-check || false }}
        run: node scripts/ci-changes.mjs

  frontend:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate localization
        run: npm run check:i18n

      - name: Test desktop
        run: npm --workspace apps/desktop test

      - name: Build frontend
        run: npm run build:frontend

  rustfmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show

      - name: Test Rust check script
        shell: pwsh
        run: ./scripts/test-check-rust.ps1

      - name: Test release metadata
        shell: pwsh
        run: ./scripts/test-release-metadata.ps1

      - name: Check Rust formatting
        shell: pwsh
        run: ./scripts/check-rust.ps1 -Check format

  rust:
    needs: [changes, rustfmt]
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, vulkan]
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-windows-x64-${{ matrix.backend }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          workspaces: |
            core -> ../.build
            apps/desktop/src-tauri -> ../../../.build

      - name: Lint Rust
        shell: pwsh
        run: ./scripts/check-rust.ps1 -Check clippy -Vulkan:('${{ matrix.backend }}' -eq 'vulkan') -CiVulkanOnly:('${{ matrix.backend }}' -eq 'vulkan')

      - name: Test Rust
        shell: pwsh
        run: ./scripts/check-rust.ps1 -Check test -Vulkan:('${{ matrix.backend }}' -eq 'vulkan') -CiVulkanOnly:('${{ matrix.backend }}' -eq 'vulkan')

  linux:
    name: linux (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build
      VRCS_PACKAGE_CHANNEL: development
    steps:
      - uses: actions/checkout@v7
      - name: Install native desktop dependencies
        run: bash scripts/install-linux-deps.sh
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-linux-${{ matrix.arch }}-cpu-vulkan-${{ hashFiles('**/Cargo.lock') }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          workspaces: |
            core -> ../.build
            apps/desktop/src-tauri -> ../../../.build
            crates/player-audio-scan -> ../../.build
            crates/player-audio-helper -> ../../.build
      - run: npm ci
      - run: npm run build:frontend
      - name: Check native CPU and Vulkan backends and test CPU
        run: |
          for manifest in core/Cargo.toml apps/desktop/src-tauri/Cargo.toml crates/player-audio-scan/Cargo.toml crates/player-audio-helper/Cargo.toml; do
            cargo clippy --locked --manifest-path "$manifest" --all-targets -- -D warnings
            dbus-run-session -- xvfb-run -a cargo test --locked --manifest-path "$manifest"
            if [ "$manifest" = core/Cargo.toml ] || [ "$manifest" = apps/desktop/src-tauri/Cargo.toml ]; then
              cargo check --locked --manifest-path "$manifest" --all-targets --features vulkan
            fi
          done
      - name: Build and load native ONNX runtime
        run: node scripts/build-linux-release.mjs --preview
      - uses: actions/upload-artifact@v7
        with:
          name: ci-linux-${{ matrix.arch }}-runtime-${{ github.sha }}
          path: |
            preview-artifacts/*.runtime.json
            preview-artifacts/*.ldd.txt
          if-no-files-found: error

  gate:
    needs: [changes, frontend, rustfmt, rust, linux]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a required check did not succeed
        if: >-
          ${{ needs.changes.result != 'success' ||
              contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
              (needs.changes.outputs.rust == 'true' &&
                (needs.rustfmt.result != 'success' || needs.rust.result != 'success' || needs.linux.result != 'success')) ||
              ((github.event_name == 'push' || needs.changes.outputs.frontend == 'true') && needs.frontend.result != 'success') }}
        run: exit 1
