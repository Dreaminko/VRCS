name: Release

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
    paths:
      - .github/workflows/**
      - .cargo/**
      - core/**
      - crates/**
      - apps/desktop/**
      - package.json
      - package-lock.json
      - rust-toolchain.toml
      - scripts/**
      - packaging/**

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci-status:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.ci.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Find complete CI for the release commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/find-release-ci.mjs

  validate:
    needs: ci-status
    if: startsWith(github.ref, 'refs/tags/') && needs.ci-status.outputs.reuse != 'true'
    uses: ./.github/workflows/ci.yml

  windows-x64:
    runs-on: windows-2022
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build
    steps:
      - uses: actions/checkout@v7
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          if ($version -ne $env:GITHUB_REF_NAME) { throw "Tag does not match application version" }
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          shared-key: release-windows-x64-vulkan-${{ hashFiles('**/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            core -> ../.build
            apps/desktop/src-tauri -> ../../../.build
      - uses: actions/setup-node@v6
        if: startsWith(github.ref, 'refs/tags/') || steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: "24"
          cache: npm
      - name: Install frontend dependencies
        if: startsWith(github.ref, 'refs/tags/') || steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Warm release dependency cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: npm --workspace apps/desktop run tauri -- build --features vulkan --config src-tauri/tauri.release.conf.json --no-sign --no-bundle -- --locked
      - name: Build standard target and manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: ./scripts/build-release.ps1 -SkipInstall -SkipTests
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-windows-x64-${{ github.sha }}
          path: release-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  linux:
    name: linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build
    steps:
      - uses: actions/checkout@v7
      - name: Install native desktop dependencies
        run: bash scripts/install-linux-deps.sh
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          shared-key: release-linux-${{ matrix.arch }}-vulkan-${{ hashFiles('**/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            core -> ../.build
            apps/desktop/src-tauri -> ../../../.build
      - run: npm ci
      - name: Warm native dependency cache and load ONNX
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: node scripts/build-linux-release.mjs --preview
      - name: Build deb and signed AppImage target manifests
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/build-linux-release.mjs --require-signed
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-linux-${{ matrix.arch }}-${{ github.sha }}
          path: release-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [ci-status, validate, windows-x64, linux]
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') &&
          needs.ci-status.result == 'success' && needs.windows-x64.result == 'success' &&
          needs.linux.result == 'success' &&
          (needs.ci-status.outputs.reuse == 'true' || needs.validate.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*-${{ github.sha }}
          merge-multiple: true
          path: release-artifacts
      - name: Install package inspection tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - name: Verify every package, architecture, checksum and updater signature
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/release-metadata.mjs aggregate release-artifacts "$GITHUB_REF_NAME"
      - name: Ensure GitHub release exists
        run: |
          cat > "$RUNNER_TEMP/release-notes.txt" <<'NOTES'
          Windows x64 and native Ubuntu 24.04 x86_64/aarch64 packages.

          Windows standard and legacy CUDA clients receive the same signed installer.
          Linux deb installations update through the package manager/manual download, not the AppImage updater.
          The deb also installs the root-owned vrcs-network-helper and polkit policy; AppImage does not install a root helper.
          AppImage installations use architecture-specific signed in-app updates.
          Linux player audio needs libopus0; the deb declares it, AppImage users install it separately.
          Ubuntu 24.04 is the Linux ABI baseline; AppImage does not promise compatibility with older distributions.
          Install CJK fonts (fonts-noto-cjk) when they are not already available.
          CI ONNX loading does not replace real desktop/audio/VR and dual-architecture hardware acceptance; consult the compatibility matrix.
          NOTES
          if gh release view "$GITHUB_REF_NAME" --json isDraft >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "VRCS $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.txt"
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "VRCS $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.txt"
          fi
      - name: Upload validated release assets
        run: gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
