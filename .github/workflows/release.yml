name: Release

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
    paths:
      - .github/workflows/release.yml
      - .cargo/**
      - Cargo.toml
      - Cargo.lock
      - core/Cargo.toml
      - apps/desktop/src-tauri/Cargo.toml
      - crates/player-audio-scan/Cargo.toml
      - rust-toolchain.toml
      - scripts/install-linux-deps.sh

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci-status:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.ci.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Find complete CI for the release commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/find-release-ci.mjs

  validate:
    needs: ci-status
    if: startsWith(github.ref, 'refs/tags/') && needs.ci-status.outputs.reuse != 'true'
    uses: ./.github/workflows/ci.yml

  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          if ($version -ne $env:GITHUB_REF_NAME) { throw "Tag does not match application version" }
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        id: cache
        with:
          shared-key: release-windows-x64-vulkan
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: . -> .build

      - uses: actions/cache@v6
        if: startsWith(github.ref, 'refs/tags/') || steps.cache.outputs.cache-hit != 'true'
        with:
          path: apps/desktop/src-tauri/resources/vulkan-runtime
          key: vulkan-runtime-${{ hashFiles('scripts/prepare-vulkan-runtime.ps1') }}

      - uses: actions/setup-node@v6
        if: startsWith(github.ref, 'refs/tags/') || steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: "24"
          cache: npm
      - name: Install frontend dependencies
        if: startsWith(github.ref, 'refs/tags/') || steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Warm release dependency cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: npm --workspace apps/desktop run tauri -- build --features vulkan --config src-tauri/tauri.release.conf.json --no-sign --no-bundle -- --locked
      - name: Build standard target and manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $version = (Get-Content -LiteralPath "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          .\scripts\build-release.ps1 -Version $version -SkipInstall -SkipTests -KeepOpenVrCache
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-windows-x64-${{ github.sha }}
          path: release-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  linux:
    name: linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install native desktop dependencies
        run: bash scripts/install-linux-deps.sh
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        id: cache
        with:
          shared-key: release-linux-${{ matrix.arch }}-vulkan
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: . -> .build
      - run: npm ci
      - name: Warm native dependency cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: |
          npm --workspace apps/desktop run tauri -- build --target x86_64-unknown-linux-gnu --features vulkan --config src-tauri/tauri.linux.release.conf.json --no-bundle --no-sign -- --locked
      - name: Build deb and signed AppImage target manifests
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/build-linux-release.mjs --require-signed
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-linux-${{ matrix.arch }}-${{ github.sha }}
          path: release-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [ci-status, validate, windows-x64, linux]
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') &&
          needs.ci-status.result == 'success' && needs.windows-x64.result == 'success' &&
          needs.linux.result == 'success' &&
          (needs.ci-status.outputs.reuse == 'true' || needs.validate.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*-${{ github.sha }}
          merge-multiple: true
          path: release-artifacts
      - name: Install package inspection tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - name: Verify every package, architecture, checksum and updater signature
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/release-metadata.mjs aggregate release-artifacts "$GITHUB_REF_NAME"
      - name: Ensure GitHub release exists
        run: |
          cat > "$RUNNER_TEMP/release-notes.txt" <<NOTES
          Windows 10/11 x64 and native Ubuntu 24.04 x86_64 packages for VRCS.

          - \`VRCS-${GITHUB_REF_NAME}-windows-x64.exe\` supports cloud recognition and managed local Qwen ASR on CPU or Vulkan. A compatible GPU and graphics driver are required for Vulkan.
          - Local recognition models and the Qwen runtime are downloaded through recognition settings. Cloud recognition does not require the Qwen runtime.
          - Linux deb installations update through the package manager/manual download, not the AppImage updater.
          - The deb installs \`/usr/bin/vrcs-desktop\` with built-in \`--network-helper\` support and the polkit policy; AppImage does not elevate its user-mounted FUSE binary via pkexec.
          - AppImage installations use architecture-specific signed in-app updates.
          - Linux player audio needs libopus0; the deb declares it, AppImage users install it separately.
          - Ubuntu 24.04 is the Linux ABI baseline; AppImage does not promise compatibility with older distributions.
          - Install CJK fonts (fonts-noto-cjk) when they are not already available.
          - CI ONNX loading does not replace real desktop/audio/VR hardware acceptance; consult the compatibility matrix.
          NOTES
          if gh release view "$GITHUB_REF_NAME" --json isDraft >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "VRCS $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.txt"
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "VRCS $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.txt"
          fi
      - name: Upload validated release assets
        run: gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
