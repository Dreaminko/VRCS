name: Release

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
    paths:
      - .github/workflows/release.yml
      - .cargo/**
      - core/**
      - crates/**
      - apps/desktop/**
      - package.json
      - package-lock.json
      - rust-toolchain.toml
      - scripts/build-release.ps1
      - scripts/run-tauri.ps1
      - scripts/prepare-vulkan-runtime.ps1
      - scripts/write-release-metadata.ps1

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/ci.yml

  windows-x64:
    runs-on: windows-2022
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build
    steps:
      - uses: actions/checkout@v7

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          if ($version -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match application version $version"
          }

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          shared-key: release-windows-x64-vulkan
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            core -> ../.build
            apps/desktop/src-tauri -> ../../../.build

      - uses: actions/setup-node@v6
        if: startsWith(github.ref, 'refs/tags/') || steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        if: startsWith(github.ref, 'refs/tags/') || steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Warm release dependency cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: npm --workspace apps/desktop run tauri -- build --features vulkan --config src-tauri/tauri.release.conf.json --no-sign --no-bundle -- --locked

      - name: Build standard release package
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $version = (Get-Content -LiteralPath "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          .\scripts\build-release.ps1 -Version $version -SkipInstall -SkipTests

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: windows-x64-${{ github.sha }}
          path: release-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [validate, windows-x64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-${{ github.sha }}
          path: release-artifacts

      - name: Ensure GitHub release exists
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag
          $notes = @'
          Windows 10/11 x64 release for VRCS.

          - `VRCS-$version-windows-x64.exe` supports cloud recognition and managed local Qwen ASR on CPU or Vulkan. A compatible GPU and graphics driver are required for Vulkan.
          - Existing local Whisper selections migrate to managed Qwen. Install the Qwen model and runtime in recognition settings before starting local recognition.
          - Cloud recognition failures use reconnection and no longer fall back to Whisper.
          - Existing Whisper files remain on disk. You can remove them manually after you confirm that older versions no longer need them. Keep any Qwen packages in the same directory.
          - Older standard and CUDA clients receive this same standard installer through the updater.
          - Local recognition models and the Qwen runtime are downloaded through recognition settings. Cloud recognition does not require the Qwen runtime.
          '@
          $notes = $notes.Replace('$version', $version)
          $notesPath = Join-Path $env:RUNNER_TEMP "vrcs-release-notes.md"
          [System.IO.File]::WriteAllText($notesPath, $notes, [System.Text.UTF8Encoding]::new($false))

          $releaseJson = gh release view $tag --json isDraft 2> $null
          if ($LASTEXITCODE -eq 0) {
            $isDraft = ($releaseJson | ConvertFrom-Json).isDraft
            Write-Host $(if ($isDraft) { "Updating existing draft release $tag" } else { "Updating published release $tag without changing its state" })
            gh release edit $tag --title "VRCS $tag" --notes-file $notesPath
          } else {
            gh release create $tag --draft --title "VRCS $tag" --notes-file $notesPath
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create or update release $tag"
          }

      - name: Upload release packages, updater signatures, and checksums
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          $assets = @(
            "release-artifacts/VRCS-$version-windows-x64.exe",
            "release-artifacts/VRCS-$version-windows-x64.exe.sig",
            "release-artifacts/VRCS-$version-windows-x64.exe.sha256",
            "release-artifacts/latest.json"
          )
          gh release upload $version @assets --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload release assets"
          }
