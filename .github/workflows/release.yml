name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.4.1"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas"]'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core-rust
            apps/desktop/src-tauri

      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match application version v$version"
          }

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        shell: pwsh
        run: |
          .\scripts\test-core.ps1
          npm --workspace apps/desktop test
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build draft GitHub release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "VRCS ${{ github.ref_name }}"
          releaseBody: "Windows x64 CUDA build for VRCS. CUDA 12.x Runtime and cuBLAS must be installed separately. The default Whisper model is downloaded on first use."
          releaseDraft: true
          args: --features cuda --config src-tauri/tauri.release.conf.json --bundles nsis

      - name: Run packaged-core self-test
        shell: pwsh
        run: |
          $executable = "apps/desktop/src-tauri/target/release/vrcs-desktop.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Built desktop executable not found: $executable"
          }
          $process = Start-Process -FilePath $executable -ArgumentList "--release-self-test" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            throw "Release self-test failed with exit code $($process.ExitCode)"
          }

      - name: Upload SHA-256 checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem -LiteralPath "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $hash = Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256
          $checksum = "$($installer.FullName).sha256"
          "$($hash.Hash.ToLowerInvariant())  $($installer.Name)" | Set-Content -LiteralPath $checksum -Encoding ascii
          gh release upload "${{ github.ref_name }}" $checksum --clobber
