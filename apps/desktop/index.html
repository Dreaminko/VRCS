<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f9fc" />
    <title>VRCS</title>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      body { background: #f6f9fc; }
      .startup-shell {
        display: grid;
        width: 100%;
        height: 100%;
        place-content: center;
        place-items: center;
        gap: 18px;
        color: #315f8b;
        font: 600 18px/1 "Segoe UI", "Yu Gothic UI", "Meiryo UI", "Microsoft YaHei UI", sans-serif;
        letter-spacing: 0.08em;
      }
      .startup-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid #deedfa;
        border-top-color: #3d73a8;
        border-radius: 50%;
        animation: startup-spin 720ms linear infinite;
      }
      @keyframes startup-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .startup-spinner { animation-duration: 1600ms; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-shell" role="status" aria-label="Starting VRCS">
        <span>VRCS</span>
        <i class="startup-spinner" aria-hidden="true"></i>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
