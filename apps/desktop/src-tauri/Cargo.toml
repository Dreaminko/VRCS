[package]
name = "vrcs-desktop"
version = "0.3.7"
description = "VRCS desktop subtitle client"
authors = ["VRCS contributors"]
license = "AGPL-3.0-only"
edition = "2021"
default-run = "vrcs-desktop"

[features]
default = []
vr-preview = []
vulkan = ["vrcs-core/vulkan"]

[lib]
name = "vrcs_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "vrcs-vr-preview"
path = "src/bin/vr-preview.rs"
required-features = ["vr-preview"]

[[bin]]
name = "vrcs-vr-surface-smoke"
path = "src/bin/vr-surface-smoke.rs"
required-features = ["vr-preview"]

[[bin]]
name = "vrcs-linux-vr-prototype"
path = "src/bin/linux-vr-prototype.rs"
required-features = ["vr-preview"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tracing = "0.1"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }
vrcs-core = { path = "../../../core", default-features = false }
png = "0.17"
futures-util = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "=0.10.1", features = ["v0_3_65"] }
libc = "0.2"
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
soup3 = "=0.5.0"
gtk = "=0.18.2"
glib = "=0.18.5"
gio = "=0.18.4"
cairo-rs = { version = "=0.18.5", features = ["png"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
openvr = "=0.9.0"
openvr_sys = "=2.1.4"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "System",
    "UI_Composition",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
openvr = "0.9.0"
openvr_sys = "2.1.4"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_System_SystemServices",
] }

# Match ONNX Runtime's C++ runtime while retaining application debug builds.
[profile.dev.package.openvr_sys]
opt-level = 1

[profile.dev.package.player-audio-scan]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

[profile.dev.package.ring]
opt-level = 3
