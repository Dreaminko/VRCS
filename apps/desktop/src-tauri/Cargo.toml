[package]
name = "vrcs-desktop"
version = "0.4.3"
description = "VRCS desktop subtitle client"
authors.workspace = true
license.workspace = true
edition.workspace = true
default-run = "vrcs-desktop"

[lints]
workspace = true

[features]
default = []
vr-preview = []
vulkan = ["vrcs-core/vulkan"]

[lib]
name = "vrcs_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "vrcs-vr-preview"
path = "src/bin/vr-preview.rs"
required-features = ["vr-preview"]

[[bin]]
name = "vrcs-vr-surface-smoke"
path = "src/bin/vr-surface-smoke.rs"
required-features = ["vr-preview"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
semver = "1"
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
tracing.workspace = true
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tokio = { workspace = true, features = ["macros", "sync"] }
uuid = { workspace = true, features = ["v4"] }
vrcs-core = { path = "../../../core", default-features = false }
png = "0.17"
taffy = "0.9"
cosmic-text = "0.14"
pulldown-cmark = { version = "0.13", default-features = false }
unicode-segmentation = "1"
resvg = { version = "0.45", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util.workspace = true
libc.workspace = true
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
openvr = "=0.9.0"
openvr_sys = "=2.1.4"
openxr = { version = "=0.22.0", default-features = false, features = ["loaded"] }
ash = "=0.38.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
openvr = "0.9.0"
openvr_sys = "2.1.4"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_System_SystemServices",
] }
