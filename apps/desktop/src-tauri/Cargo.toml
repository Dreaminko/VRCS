[package]
name = "vrcs-desktop"
version = "0.1.0"
description = "VRCS desktop subtitle client"
authors = ["VRCS contributors"]
edition = "2021"
default-run = "vrcs-desktop"

[features]
default = []
cuda = ["vrcs-core/cuda"]

[lib]
name = "vrcs_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
uuid = { version = "1", features = ["v4"] }
vrcs-core = { path = "../../../core-rust" }
