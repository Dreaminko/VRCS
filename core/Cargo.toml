[package]
name = "vrcs-core"
version = "0.3.12"
description = "VRCS local core service (Rust)"
authors.workspace = true
license.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
default = []
vulkan = []

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true, features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "multipart"], default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
ndarray = "0.17"
ort = { version = "=2.0.0-rc.12", features = ["ndarray"] }
rustfft = "6.4.1"
futures-util.workspace = true
base64 = "0.22"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
sha2 = "0.10"
ring.workspace = true
zeroize.workspace = true
libloading = "0.8"
player-audio-scan = { path = "../crates/player-audio-scan" }
serde_ignored = "0.1"
uuid = { workspace = true, features = ["v4"] }
thiserror = "2"
rosc = "0.11"
mdns-sd = "=0.20.3"
flate2 = "=1.1.9"
tar = { version = "=0.4.46", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
pipewire = { version = "=0.10.1", features = ["v0_3_65"] }
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"] }

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.12", features = ["directml"] }
wasapi = "0.23"
windows = { workspace = true, features = [
  "Graphics_Capture",
  "Graphics_DirectX_Direct3D11",
  "Security_Authorization_AppCapabilityAccess",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Networking_WinSock",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Storage_FileSystem",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
hound = "3.5"
