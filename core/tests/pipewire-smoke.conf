context.properties = {
  core.daemon = true
  core.name = vrcs-test-pipewire
  default.clock.rate = 48000
  default.clock.allowed-rates = [ 44100 48000 ]
  default.clock.quantum = 256
}
context.spa-libs = {
  audio.convert.* = audioconvert/libspa-audioconvert
  support.* = support/libspa-support
  audiotestsrc = audiotestsrc/libspa-audiotestsrc
}
context.modules = [
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-metadata }
  { name = libpipewire-module-spa-node-factory }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-link-factory }
  { name = libpipewire-module-access }
]
# Non-live sources follow the shared driver, avoiding free-running timer starvation.
context.objects = [
  { factory = spa-node-factory args = { factory.name = support.node.driver node.name = Test-Driver priority.driver = 200000 node.group = test-clock } }
  { factory = adapter args = { factory.name = audiotestsrc node.name = vrcs-test-source node.group = test-clock node.description = "VRCS isolated microphone" media.class = Audio/Source node.driver = false audio.format = F32LE audio.rate = 48000 audio.channels = 2 audio.position = [ FL FR ] node.param.Props = { live = false wave = sine freq = 440 volume = 0.25 } } }
  { factory = adapter args = { factory.name = support.null-audio-sink node.name = vrcs-test-sink node.group = test-clock node.driver = false node.description = "VRCS isolated output" media.class = Audio/Sink audio.format = F32LE audio.rate = 48000 audio.channels = 2 audio.position = [ FL FR ] } }
]
